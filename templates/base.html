<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Intranet Funserv{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block head_extra %}{% endblock %}

    <style>
        body {
            background-color: #f9f9f9;
            padding-top: 30px;
        }
        .logo {
            max-height: 100px;
        }
        .divisoria-direita {
        border-right: 1px solid #dee2e6; /* cor padrão do Bootstrap */
        }
    </style>
</head>
<body>

    <!-- Navbar ocupando toda a largura -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm px-4 mb-4">
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='img/logo-funserv-200px.png') }}" alt="Logo Funserv" class="logo me-2">
            <span class="fs-4">Intranet Funserv</span>
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">Início</a>
                </li>
                <form method="get" class="text-center mb-4">
                    <input type="text" name="busca" placeholder="Buscar por nome do recado..." value="{{ busca }}"
                        class="form-control d-inline-block w-50 me-2">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </form>
                <li class="nav-item">
                    <a class="nav-link text-info" href="#"><strong>{{ diretoria }}</strong></a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container-fluid px-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block script_extra %}{% endblock %}
</body>
</html>
