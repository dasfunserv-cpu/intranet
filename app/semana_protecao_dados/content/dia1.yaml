quiz:
  - item: "CPF de um beneficiário"
    resposta: pessoal
    explicacao: "CPF identifica diretamente uma pessoa. Dado pessoal clássico."

  - item: "Diagnóstico médico em atestado"
    resposta: sensivel
    explicacao: "Dados de saúde são sensíveis e exigem proteção reforçada."

  - item: "Número de matrícula"
    resposta: pessoal
    explicacao: "Identifica a pessoa dentro da instituição. É dado pessoal."

  - item: "Relatório estatístico: '40% dos aposentados têm mais de 70 anos'"
    resposta: nao
    explicacao: "Estatística agregada não identifica ninguém. Não é dado pessoal."

  - item: "Planilha com 'Servidor 001, Servidor 002...' mas com a chave de tradução guardada em outro arquivo"
    resposta: pseudonimizado
    explicacao: "Pseudonimização: substituiu o identificador, mas dá pra reverter com a chave."

  - item: "CNPJ de uma empresa em um contrato."
    resposta: nao
    explicacao: "CNPJ identifica uma empresa, não uma pessoa física. Não é dado pessoal."

fecho: |
  <p>Pronto, primeiro dia fechado. Amanhã: <strong>Caça ao Phishing</strong>: como identificar o golpe mais comum que chega na sua caixa de entrada.</p>