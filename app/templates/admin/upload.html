{% extends "base.html" %}

{% block title %}Upload - Administração{% endblock %}
{% block header %}Enviar Novo Documento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Arquivo</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                        <div class="form-text">Formatos permitidos: PDF, DOC, DOCX, XLS, XLSX, etc.</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="sector_id" class="form-label">Setor</label>
                            <select class="form-select" id="sector_id" name="sector_id" required>
                                <option value="" selected disabled>Selecione um setor...</option>
                                {% for s in sectors %}
                                <option value="{{ s.id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="category_id" class="form-label">Categoria (Opcional)</label>
                            <select class="form-select" id="category_id" name="category_id">
                                <option value="" selected>Sem categoria...</option>
                                {% for c in categories %}
                                <option value="{{ c.id }}">{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Descrição / Resumo</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Do que se trata este documento?"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="tags" class="form-label">Tags (separadas por vírgula)</label>
                        <input type="text" class="form-control" id="tags" name="tags" placeholder="ex: portaria, 2024, financeiro">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.manage') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-upload me-2"></i> Iniciar Upload
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
