<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Intranet Funserv{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    {% block head_extra %}{% endblock %}

    <style>
        body {
            background-color: #f9f9f9;
            padding-top: 90px; /* espaço para a navbar */
        }
        .logo {
            max-height: 80px;
        }
        .navbar .container-fluid {
            padding-left: 48px;
            padding-right: 48px;
        }
    </style>
</head>
<body>

    <!-- Navbar ocupa toda a largura da tela -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='img/logo-funserv-200px.png') }}" alt="Logo Funserv" class="logo me-2">
                <span><strong>Intranet Funserv</strong></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarConteudo" aria-controls="navbarConteudo" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarConteudo">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><strong style="color: #0d6efd">{{diretoria}}</strong></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo centralizado -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block script_extra %}{% endblock %}
</body>
</html>
