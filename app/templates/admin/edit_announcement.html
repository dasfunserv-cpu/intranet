{% extends "base.html" %}

{% block title %}Editar Aviso - Intranet Funserv{% endblock %}
{% block header %}Editar Aviso{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <a href="{{ url_for('admin.manage_announcements') }}" class="btn btn-outline-secondary rounded-pill">
            <i class="fas fa-arrow-left me-2"></i>Voltar
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow rounded-4 border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="card-title mb-0">Editar Aviso #{{ announcement.id }}</h5>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('admin.edit_announcement', ann_id=announcement.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Título</label>
                        <input type="text" name="title" class="form-control" value="{{ announcement.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Conteúdo</label>
                        <textarea name="content" class="form-control" rows="8" required>{{ announcement.content }}</textarea>
                    </div>
                    <div class="mb-4 form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_important" id="is_important" {% if announcement.is_important %}checked{% endif %}>
                        <label class="form-check-label fw-bold" for="is_important">Marcar como Importante/Urgente</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="fas fa-save me-2"></i>Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
